name: Actualizar precios y nutrición

on:
  schedule:
    - cron: "0 6 * * 0"   # cada domingo a las 6:00 (UTC), antes de hacer la compra
  workflow_dispatch:        # botón para lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python actualizar_productos.py
      - name: Guardar cambios
        run: |
          git config user.name "volumen-bot"
          git config user.email "volumen-bot@users.noreply.github.com"
          git add productos.json
          git diff --cached --quiet || git commit -m "Precios actualizados $(date +%F)"
          git push
