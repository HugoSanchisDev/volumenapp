<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Volumen, tu plan para ganar masa</title>
<meta name="theme-color" content="#2450C6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF1EC; --card:#FFFFFF; --ink:#14233A; --muted:#5B6878; --line:#D6DBD4;
  --accent:#2450C6; --accent-ink:#FFFFFF; --soft:#E3E8F3;
  --prot:#BF3F2D; --carb:#D38F22; --fat:#4C8748; --warn:#A24A0B; --warn-soft:#FBEBD9;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E141C; --card:#16202B; --ink:#E6EBF1; --muted:#9AA6B4; --line:#283441;
    --accent:#86A6FF; --accent-ink:#0E141C; --soft:#1C2939;
    --prot:#E86B58; --carb:#EAB050; --fat:#82BD7C; --warn:#F2A461; --warn-soft:#33241A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E141C; --card:#16202B; --ink:#E6EBF1; --muted:#9AA6B4; --line:#283441;
  --accent:#86A6FF; --accent-ink:#0E141C; --soft:#1C2939;
  --prot:#E86B58; --carb:#EAB050; --fat:#82BD7C; --warn:#F2A461; --warn-soft:#33241A;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);
  font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5;
  font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:600px;margin:0 auto;padding:0 18px 110px}
h1,h2,h3{font-stretch:118%;line-height:1.1;margin:0}
h1{font-size:30px;font-weight:850;letter-spacing:-.01em}
h2{font-size:21px;font-weight:800}
h3{font-size:17px;font-weight:750}
p{margin:.4em 0}
.muted{color:var(--muted)}
.small{font-size:14px}
.top{padding:22px 0 14px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.top .sub{font-size:15px;color:var(--muted);margin-top:4px}
.sync{font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}

.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0}
.panel.flat{background:transparent}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:420px){.grid3{grid-template-columns:1fr 1fr}}

.btn{appearance:none;border:1.5px solid var(--ink);background:transparent;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.block{width:100%}
.btn.ghost{border-color:var(--line)}
.btn.sm{padding:6px 12px;min-height:34px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}

label.f{display:block;font-size:14px;font-weight:650;margin-bottom:5px}
.inp{width:100%;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
.inp:focus{border-color:var(--accent);outline:none}
.field{margin-bottom:14px}
.hint{font-size:13px;color:var(--muted);margin-top:4px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;cursor:pointer;min-height:36px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.x[aria-pressed="true"]{background:var(--prot);border-color:var(--prot);color:#fff}

.seg{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;padding:9px 4px;font-weight:650;cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* macro bars */
.macros{display:grid;gap:10px}
.mbar .lab{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.mbar .lab b{font-weight:750}
.track{height:10px;border-radius:6px;background:var(--soft);overflow:hidden}
.track i{display:block;height:100%;border-radius:6px}
.k i{background:var(--ink)} .p i{background:var(--prot)} .c i{background:var(--carb)} .g i{background:var(--fat)}
.dotp{color:var(--prot)} .dotc{color:var(--carb)} .dotg{color:var(--fat)}

/* day timeline */
.rail{position:relative;margin-top:8px}
.ev{display:grid;grid-template-columns:52px 22px 1fr;gap:0 8px;position:relative}
.ev .t{font-weight:750;font-size:15px;padding-top:12px;text-align:right;font-stretch:90%}
.ev .dot{position:relative}
.ev .dot::before{content:"";position:absolute;left:10px;top:0;bottom:0;width:2px;background:var(--line)}
.ev:first-child .dot::before{top:18px}
.ev:last-child .dot::before{bottom:calc(100% - 18px)}
.ev .dot span{position:absolute;left:4px;top:14px;width:14px;height:14px;border-radius:50%;background:var(--card);border:2.5px solid var(--muted)}
.ev.meal .dot span{border-color:var(--accent)}
.ev.done .dot span{background:var(--accent);border-color:var(--accent)}
.ev.train .dot span{border-color:var(--prot);border-radius:3px}
.ev .body{padding:8px 0 14px}
.ev .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.ev.minor .card{background:transparent;border:0;padding:4px 0}
.check{display:flex;gap:12px;align-items:flex-start}
.check input{width:24px;height:24px;margin:2px 0 0;accent-color:var(--accent);flex:none;cursor:pointer}
.mm{font-size:13px;color:var(--muted);margin-top:2px}
details summary{cursor:pointer;font-weight:650;font-size:14px;color:var(--accent);list-style:none;margin-top:8px}
details summary::-webkit-details-marker{display:none}
.ing{list-style:none;padding:0;margin:8px 0 0;font-size:15px}
.ing li{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line)}
.ing li:last-child{border-bottom:0}
.ing .q{font-weight:750;white-space:nowrap}
.steps{margin:10px 0 0;padding-left:20px;font-size:15px}
.steps li{margin-bottom:4px}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:1px 6px;background:var(--soft);color:var(--muted);margin-left:6px;vertical-align:1px}

.banner{border-radius:18px;padding:18px;margin:14px 0;background:var(--warn-soft);border:1.5px solid var(--warn)}
.banner h2{color:var(--warn)}
.lock{text-align:center;padding:34px 18px}
.lock .big{font-size:44px;line-height:1}

.days{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px}
.days button{flex:1;min-width:44px;border:1.5px solid var(--line);background:transparent;border-radius:12px;padding:6px 0;cursor:pointer;font-weight:700}
.days button small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.days button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.days button[aria-pressed="true"] small{color:var(--paper);opacity:.75}
.days button.today{border-color:var(--accent)}

.mealcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:10px 0}
.mealcard .head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.mealcard .slot{font-size:13px;color:var(--muted);font-weight:600}

.shop h3{margin:18px 0 6px}
.shop label{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.shop label input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.shop label .nm{flex:1}
.shop label.got .nm{text-decoration:line-through;color:var(--muted)}
.shop .qty{font-weight:750;white-space:nowrap}
.shop a{color:var(--accent)}
.supp a{color:var(--accent)}
.shop .eur{font-size:13px;color:var(--muted);width:56px;text-align:right}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--card)}
.stat b{display:block;font-size:22px;font-stretch:110%;font-weight:800;line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}
.chartbox{overflow-x:auto}
.chartbox svg{width:100%;height:auto;min-width:320px;display:block}

.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ph{border:1.5px dashed var(--line);border-radius:14px;aspect-ratio:3/4;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden;cursor:pointer;background:var(--paper);font-size:14px;font-weight:650;padding:6px}
.ph.has{border-style:solid;border-color:var(--accent)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph .ref{position:absolute;left:6px;bottom:6px;width:34%;aspect-ratio:3/4;border-radius:6px;overflow:hidden;border:2px solid var(--card);opacity:.9}
.ph .ref img{position:static;width:100%;height:100%;object-fit:cover}
.ph input{position:absolute;inset:0;opacity:0;cursor:pointer}
.ph .cap{position:relative;z-index:1;background:var(--card);border-radius:8px;padding:2px 8px}
.ph.has .cap{position:absolute;top:6px;left:6px}

.rate{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;margin-bottom:10px}
.rate .seg{min-width:200px}

.compare{position:relative;aspect-ratio:3/4;border-radius:16px;overflow:hidden;background:var(--soft);max-width:420px;margin:12px auto 0}
.compare img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.compare .after{clip-path:inset(0 0 0 50%)}
.compare .line{position:absolute;top:0;bottom:0;left:50%;width:3px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.compare .lbl{position:absolute;top:10px;background:rgba(0,0,0,.6);color:#fff;font-size:13px;font-weight:700;border-radius:6px;padding:2px 8px}
.range{width:100%;accent-color:var(--accent);margin-top:10px}

.hist{border-top:1px solid var(--line);padding:12px 0}
.hist:first-child{border-top:0}
.coach{white-space:pre-wrap;font-size:15px;background:var(--soft);border-radius:12px;padding:12px;margin-top:10px}

.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.scroll{overflow-x:auto}

.calc{list-style:none;padding:0;margin:0}
.calc li{display:grid;grid-template-columns:1fr auto;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.calc li b{font-weight:800}
.calc li small{grid-column:1/-1;color:var(--muted);font-size:13px;margin-top:-4px}

.supp{border-top:1px solid var(--line);padding:12px 0}
.supp:first-of-type{border-top:0}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav.tabs .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav.tabs button{border:0;background:transparent;padding:9px 2px 10px;cursor:pointer;font-size:12px;font-weight:650;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;min-height:56px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs button .badge{width:7px;height:7px;border-radius:50%;background:var(--warn);position:absolute;margin-left:18px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-weight:650;font-size:14px;z-index:20;max-width:90vw}
.center{text-align:center}
.mt0{margin-top:0}.mt8{margin-top:8px}.mt16{margin-top:16px}
.hr{height:1px;background:var(--line);margin:14px 0}
@media (prefers-reduced-motion:no-preference){ .track i{transition:width .4s ease} }

/* cajón para cambiar comida */
#sheet{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,15,22,.55)}
#sheet[hidden]{display:none}
.sheetbox{background:var(--paper);width:100%;max-width:600px;max-height:88vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:16px 18px calc(24px + env(safe-area-inset-bottom,0px))}
.opt{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;margin:10px 0}
.opt.cur{border:2px solid var(--accent)}
.linkbtn{background:none;border:0;padding:6px 0;color:var(--muted);text-decoration:underline;font-size:13px;cursor:pointer;min-height:32px}
/* entrenos */
.exc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:10px 0}
.setrow{display:flex;align-items:center;gap:8px;margin:6px 0}
.setrow .sn{width:22px;font-weight:800;color:var(--muted)}
.inp.sm{width:80px;min-height:42px;padding:6px 10px;text-align:center}
.sug{font-size:13px;background:var(--soft);border-radius:10px;padding:8px 10px;margin:8px 0}
.imgs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.imgs img{border-radius:12px;background:var(--soft);width:100%;height:auto}
.exc a,.panel a{color:var(--accent)}
</style>
</head>
<body>
<div id="app" class="wrap"><p class="muted" style="padding-top:40px">Cargando tu plan…</p></div>
<nav class="tabs" id="tabs" hidden></nav>
<div id="toast" class="toast" hidden></div>
<div id="sheet" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const BUCKET="fotos";

/* ============ DATOS: productos (valores por 100 g, precio orientativo €/kg) ============ */
const SECTIONS=["Carne y pescado","Huevos y lácteos","Panadería y cereales","Fruta y verdura","Congelados","Despensa","Suplementos"];
const PRODUCTS={
 avena:{n:"Copos de avena",sec:"Panadería y cereales",k:370,p:13,c:59,f:7,eur:2.3},
 arroz:{n:"Arroz largo",sec:"Despensa",k:350,p:7,c:78,f:0.6,eur:1.6},
 pasta:{n:"Pasta (macarrones o espaguetis)",sec:"Despensa",k:355,p:12.5,c:71,f:1.5,eur:1.3},
 panInt:{n:"Pan integral de molde",sec:"Panadería y cereales",k:250,p:10,c:42,f:3.5,eur:3.0},
 barra:{n:"Pan de barra",sec:"Panadería y cereales",k:265,p:9,c:52,f:1.5,eur:3.2},
 wrap:{n:"Tortillas de trigo (wraps)",sec:"Panadería y cereales",k:300,p:8.5,c:50,f:7,eur:5.5},
 tortitas:{n:"Tortitas de arroz",sec:"Panadería y cereales",k:385,p:8,c:81,f:3,eur:9},
 patata:{n:"Patatas",sec:"Fruta y verdura",k:77,p:2,c:17,f:0.1,eur:1.3},
 boniato:{n:"Boniato",sec:"Fruta y verdura",k:86,p:1.6,c:20,f:0.1,eur:2.0},
 platano:{n:"Plátano",sec:"Fruta y verdura",k:90,p:1.1,c:20,f:0.3,eur:2.0,unit:{g:120,s:"plátano",pl:"plátanos"}},
 frutosRojos:{n:"Frutos rojos congelados",sec:"Congelados",k:45,p:1,c:8,f:0.3,eur:6.5},
 miel:{n:"Miel",sec:"Despensa",k:304,p:0.3,c:82,f:0,eur:7},
 garbanzos:{n:"Garbanzos cocidos (bote)",sec:"Despensa",k:120,p:7,c:16,f:2.5,eur:2.2},
 lentejas:{n:"Lentejas cocidas (bote)",sec:"Despensa",k:95,p:7,c:13,f:0.6,eur:2.2},
 pollo:{n:"Pechuga de pollo",sec:"Carne y pescado",k:110,p:23,c:0,f:1.5,eur:7.5},
 muslo:{n:"Contramuslo de pollo deshuesado",sec:"Carne y pescado",k:150,p:19,c:0,f:8,eur:6.5},
 picada:{n:"Carne picada de vacuno",sec:"Carne y pescado",k:190,p:19,c:0,f:12,eur:8.5},
 pavo:{n:"Pechuga de pavo en lonchas",sec:"Carne y pescado",k:100,p:20,c:1.5,f:1.5,eur:11},
 salmon:{n:"Salmón en lomos",sec:"Carne y pescado",k:200,p:20,c:0,f:13,eur:15},
 merluza:{n:"Merluza congelada",sec:"Congelados",k:75,p:16,c:0,f:1,eur:8},
 atun:{n:"Atún claro al natural (latas)",sec:"Despensa",k:110,p:25,c:0,f:1,eur:11},
 huevos:{n:"Huevos L",sec:"Huevos y lácteos",k:145,p:12.5,c:0.7,f:10,eur:3.6,unit:{g:60,s:"huevo",pl:"huevos"}},
 claras:{n:"Claras de huevo pasteurizadas",sec:"Huevos y lácteos",k:48,p:11,c:0.5,f:0.2,eur:4.5,ml:true},
 quesoBatido:{n:"Queso fresco batido 0%",sec:"Huevos y lácteos",k:47,p:8,c:3.5,f:0.1,eur:2.4},
 yogurP:{n:"Yogur natural +proteínas",sec:"Huevos y lácteos",k:60,p:10,c:4,f:0.3,eur:5.5},
 lecheS:{n:"Leche semidesnatada",sec:"Huevos y lácteos",k:46,p:3.1,c:4.7,f:1.6,eur:0.95,ml:true},
 lecheE:{n:"Leche entera",sec:"Huevos y lácteos",k:63,p:3.1,c:4.7,f:3.6,eur:1.05,ml:true},
 queso:{n:"Queso en lonchas",sec:"Huevos y lácteos",k:330,p:23,c:0.5,f:26,eur:9},
 aove:{n:"Aceite de oliva virgen extra",sec:"Despensa",k:884,p:0,c:0,f:100,eur:7.5,ml:true},
 aguacate:{n:"Aguacate",sec:"Fruta y verdura",k:160,p:2,c:2,f:15,eur:5.5},
 cacahuete:{n:"Crema de cacahuete 100%",sec:"Despensa",k:600,p:25,c:12,f:50,eur:7.5},
 nueces:{n:"Nueces peladas",sec:"Despensa",k:650,p:15,c:7,f:65,eur:10},
 almendras:{n:"Almendras naturales",sec:"Despensa",k:600,p:21,c:6,f:52,eur:11},
 brocoli:{n:"Brócoli congelado",sec:"Congelados",k:34,p:2.8,c:4.5,f:0.4,eur:2.5},
 salteado:{n:"Verduras para saltear (congeladas)",sec:"Congelados",k:40,p:2,c:6,f:0.3,eur:2.8},
 espinacas:{n:"Espinacas o bolsa de ensalada",sec:"Fruta y verdura",k:23,p:2.9,c:1.4,f:0.4,eur:6},
 pimiento:{n:"Pimiento",sec:"Fruta y verdura",k:25,p:1,c:5,f:0.3,eur:2.5},
 tomate:{n:"Tomate",sec:"Fruta y verdura",k:20,p:0.9,c:3.5,f:0.2,eur:2.2},
 cebolla:{n:"Cebolla",sec:"Fruta y verdura",k:40,p:1.1,c:9,f:0.1,eur:1.5},
 tomateTri:{n:"Tomate triturado",sec:"Despensa",k:30,p:1.3,c:5,f:0.2,eur:1.4},
 whey:{n:"Proteína whey",sec:"Suplementos",k:380,p:78,c:6,f:6,eur:25,shop:"Tienda de suplementos"}
};
/* Catálogo real (productos.json): precios de Mercadona y nutrición de Open Food Facts.
   Lo actualiza cada semana la GitHub Action. Si no está, se usan los valores de arriba. */
let CATALOG=null;
async function loadCatalog(){
  try{
    const r=await fetch("productos.json",{cache:"no-cache"});if(!r.ok)return;
    CATALOG=await r.json();
    for(const[k,c]of Object.entries(CATALOG.productos||{})){
      const p=PRODUCTS[k];if(!p)continue;
      p.mc=c;
      if(c.precio_kg>0&&c.precio_kg<200)p.eur=c.precio_kg;
      const n=c.nutricion;if(n&&n.k>0){p.k=n.k;p.p=n.p;p.c=n.c;p.f=n.f;p.src=n.fuente}
    }
    scaleCache.clear();render();
  }catch(e){}

function setSync(m){syncMsg=m;const s=$("#sync");if(s)s.textContent=m}
let saving=false,pendingSave=false,saveTimer=null;
function persist(){state.updatedAt=Date.now();dirty=true;saveLocal();clearTimeout(saveTimer);saveTimer=setTimeout(flush,700)}
async function flush(){
  if(!sb||!uid()||!state)return;
  if(saving){pendingSave=true;return}
  saving=true;
  const {error}=await sb.from("app_state").upsert({user_id:uid(),data:state,updated_at:new Date().toISOString()});
  saving=false;
  if(error){setSync(navigator.onLine?"Error al guardar en la nube":"Sin conexión: guardado en el móvil")}
  else{dirty=false;setSync("Guardado en la nube")}
  if(pendingSave){pendingSave=false;flush()}
}
window.addEventListener("online",()=>{if(dirty)flush()});
async function loadState(){
  state=loadLocal();
  const {data,error}=await sb.from("app_state").select("data").eq("user_id",uid()).maybeSingle();
  if(error){setSync("Sin conexión: usando los datos del móvil");return}
  const remote=data&&data.data;
  if(remote&&(!state||(remote.updatedAt||0)>=(state.updatedAt||0))){state=remote;saveLocal();syncMsg="Guardado en la nube"}
  else if(state){dirty=true;flush()}
  else syncMsg="";
}

/* ============ CÁLCULOS ============ *//* ============ CÁLCULOS ============ */
function currentWeight(){
  const ci=state.checkins; if(ci.length)return ci[ci.length-1].avg;
  return state.profile.peso;
}
function gainRange(nivel){return{principiante:[0.2,0.4],intermedio:[0.15,0.3],avanzado:[0.1,0.2]}[nivel]}
function calc(){
  const p=state.profile,w=currentWeight();
  const bmr=10*w+6.25*p.altura-5*p.edad+(p.sexo==="hombre"?5:-161);
  const base={baja:1.25,media:1.35,alta:1.5}[p.actividad];
  const factor=base+p.gymDays.length*0.04+p.padelDays.length*0.04;
  const tdee=bmr*factor;
  const surplus={principiante:400,intermedio:300,avanzado:200}[p.nivel];
  const kcal=Math.round((tdee+surplus+state.kcalAdj)/10)*10;
  const P=Math.round(2*w),F=Math.round(1*w),C=Math.round((kcal-P*4-F*9)/4);
  return{w,bmr,base,factor,tdee,surplus,adj:state.kcalAdj,kcal,P,F,C,range:gainRange(p.nivel)};
}
function macrosOf(items){let k=0,p=0,c=0,f=0;for(const[id,g]of items){const x=PRODUCTS[id];k+=x.k*g/100;p+=x.p*g/100;c+=x.c*g/100;f+=x.f*g/100}return{k,p,c,f}}
const scaleCache=new Map();
function scaleRecipe(r,kT,pT,fT){
  const key=`${r.id}|${Math.round(kT)}|${Math.round(pT)}|${Math.round(fT)}`;
  if(scaleCache.has(key))return scaleCache.get(key);
  let sp=1,sc=1,sf=1;
  const sum=(role,k)=>r.items.filter(i=>i[2]===role).reduce((a,i)=>a+PRODUCTS[i[0]][k]*i[1]/100,0);
  const P1=sum("P","p"),C1=sum("C","k"),F1=sum("F","f");
  const scaleOf=role=>role==="P"?sp:role==="C"?sc:role==="F"?sf:1;
  for(let it=0;it<20;it++){
    let pO=0,fO=0,kNC=0;
    for(const[id,g,role]of r.items){const x=PRODUCTS[id];const gg=g*scaleOf(role);
      if(role!=="P")pO+=x.p*gg/100; if(role!=="F")fO+=x.f*gg/100; if(role!=="C")kNC+=x.k*gg/100;}
    sp=P1>0?clamp((pT-pO)/P1,0.5,2.5):1;
    sf=F1>0?clamp((fT-fO)/F1,0.4,1.6):1;
    sc=C1>0?clamp((kT-kNC)/C1,0.35,4):1;
  }
  const items=r.items.map(([id,g,role])=>{
    let gg=g*scaleOf(role);
    if(id==="huevos"){gg=Math.max(1,Math.round(gg/60))*60}
    else gg=Math.max(5,r5(gg));
    return[id,gg,role];
  });
  const out={r,items,m:macrosOf(items)};
  scaleCache.set(key,out);return out;
}
function qtyLabel(id,g){
  const x=PRODUCTS[id];
  if(id==="huevos"){const n=Math.round(g/60);return `${n} ${n===1?"huevo":"huevos"}`}
  if(x.ml)return g>=1000?`${fmt1(g/1000)} l`:`${fmt0(g)} ml`;
  let s=g>=1000?`${fmt1(g/1000)} kg`:`${fmt0(g)} g`;
  if(id==="platano"){const n=g/120;s+=` (≈${n<1.25?1:fmt1(n).replace(",0","")} ${n<1.25?"plátano":"plátanos"})`}
  return s;
}

/* ============ PLAN ============ */
function recipesFor(slot){
  const ex=state.profile.exclude||[],hid=state.hidden||[];
  const all=RECIPES.filter(r=>r.slots.includes(slot));
  let l=all.filter(r=>!hid.includes(r.id)&&!r.items.some(i=>ex.includes(i[0])));
  if(!l.length)l=all.filter(r=>!r.items.some(i=>ex.includes(i[0])));
  return l.length?l:all;
}
function weekNum(ws){return Math.round((dObj(ws)-new Date(2024,0,1))/(7*864e5))}
function blockOf(d){return d<=2?0:d<=4?1:2}
function baseRecipe(ws,d,slot){
  const list=recipesFor(slot),wn=weekNum(ws);
  if(slot==="comida"||slot==="cena"){const off=slot==="cena"?2:0;return list[(wn*3+blockOf(d)+off)%list.length]}
  const off={desayuno:0,media:1,merienda:2}[slot];
  return list[(wn+d+off)%list.length];
}
function recipeAt(ws,d,slot){
  const sw=(state.swaps[ws]||{})[`${d}-${slot}`];
  return (sw&&RECIPES.find(r=>r.id===sw))||baseRecipe(ws,d,slot);
}
function mealAt(ws,d,slot){
  const c=calc(),si=SLOT_INFO[slot];
  return scaleRecipe(recipeAt(ws,d,slot),c.kcal*si.k,c.P*si.p,c.F*si.k);
}
function dayMeals(ws,d){return SLOTS.map(s=>({slot:s,...mealAt(ws,d,s)}))}
function schedule(d){
  const p=state.profile,wake=toMin(p.despertar),train=toMin(p.entreno),bed=toMin(p.dormir<p.despertar?"23:59":p.dormir);
  const trains=p.gymDays.includes(d)||p.padelDays.includes(d);
  const t={};
  t.desayuno=r15(wake+20);
  t.comida=Math.max(t.desayuno+240,toMin("14:00"));
  t.media=r15((t.desayuno+t.comida)/2);
  let cena=Math.max(bed-150,t.comida+300);
  if(trains&&train>t.comida)cena=Math.max(cena,train+105);
  t.cena=r15(Math.min(cena,bed-75));
  t.merienda=(trains&&train>t.comida+90&&train<t.cena)?r15(train-90):r15((t.comida+t.cena)/2);
  return{t,trains,gym:p.gymDays.includes(d),padel:p.padelDays.includes(d),train,bed,wake};
}

function weekStartNow(){return mondayOf(today())}
function checkinDue(){
  if(!state.checkins.length)return true;
  return !state.checkins.some(c=>c.weekStart===weekStartNow());
}
function measNeeded(){
  const withM=state.checkins.filter(c=>c.meas);
  if(!state.checkins.length)return false;
  if(!withM.length)return true;
  return diffDays(withM[withM.length-1].date,today())>=13;
}
function weekAvg(endDate){
  const from=addDays(endDate,-6);
  const ws=state.weights.filter(w=>w.d>=from&&w.d<=endDate);
  if(!ws.length)return null;
  return ws.reduce((a,w)=>a+w.kg,0)/ws.length;
}
const urlCache={};
function imgTag(ref,attrs){
  if(!ref)return "";
  if(ref.startsWith("local:")){let s="";try{s=localStorage.getItem("volumen-foto-"+ref.slice(6))||""}catch(e){}return `<img src="${s}" ${attrs}>`}
  return `<img ${urlCache[ref]?`src="${urlCache[ref]}"`:""} data-ref="${esc(ref)}" ${attrs}>`;
}
async function hydratePhotos(){
  const imgs=[...document.querySelectorAll("img[data-ref]")];
  const need=[...new Set(imgs.map(i=>i.dataset.ref).filter(r=>!urlCache[r]))];
  if(need.length&&sb){
    const {data}=await sb.storage.from(BUCKET).createSignedUrls(need,60*60*24*7);
    (data||[]).forEach(d=>{if(d.signedUrl)urlCache[d.path]=d.signedUrl});
  }
  imgs.forEach(i=>{const u=urlCache[i.dataset.ref];if(u&&i.getAttribute("src")!==u)i.src=u});
}
function lastPhoto(pose){for(let i=state.checkins.length-1;i>=0;i--){const r=state.checkins[i].photos?.[pose];if(r)return r}return null}

async function compressImage(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const max=1280,sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const cv=document.createElement("canvas");cv.width=Math.round(img.naturalWidth*sc);cv.height=Math.round(img.naturalHeight*sc);
    cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
    return await new Promise(r=>cv.toBlob(b=>r({blob:b,canvas:cv}),"image/jpeg",0.82));
  }finally{URL.revokeObjectURL(url)}
}
async function storePhoto(file){
  const {blob,canvas}=await compressImage(file);
  if(sb&&uid()&&navigator.onLine){
    const path=`${uid()}/${Date.now().toString(36)}-${Math.random().toString(36).slice(2,7)}.jpg`;
    const {error}=await sb.storage.from(BUCKET).upload(path,blob,{contentType:"image/jpeg",upsert:false});
    if(!error)return path;
    toast("No se pudo subir a la nube; se guarda en el móvil");
  }
  const small=document.createElement("canvas");const sc=Math.min(1,600/Math.max(canvas.width,canvas.height));
  small.width=Math.round(canvas.width*sc);small.height=Math.round(canvas.height*sc);
  small.getContext("2d").drawImage(canvas,0,0,small.width,small.height);
  const key=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  try{localStorage.setItem("volumen-foto-"+key,small.toDataURL("image/jpeg",0.7));return "local:"+key}
  catch(e){toast("No se pudo guardar la foto");return null}
}

function submitCheckin(){
  const dr=ui.draft,c0=calc(),first=!state.checkins.length;
  const avg=parseFloat(String(dr.avg).replace(",","."));
  const errs=[];
  if(!(avg>30&&avg<250))errs.push("el peso medio");
  for(const[k,l]of POSES)if(!dr.photos[k])errs.push(`la foto ${l.toLowerCase()}`);
  const mNeed=measNeeded();
  let meas=null;const anyM=MEAS.some(([k])=>dr.meas[k]);
  if(mNeed||anyM){
    meas={};for(const[k,l]of MEAS){const v=parseFloat(String(dr.meas[k]||"").replace(",","."));if(v>0)meas[k]=v;else if(mNeed)errs.push(`la medida de ${l.split(" (")[0].toLowerCase()}`)}
  }
  if(!first)for(const k of["energia","hambre","sueno","gym","adherencia"])if(!dr.rate[k]){errs.push("las valoraciones de la semana");break}
  if(errs.length){toast("Falta "+errs.slice(0,2).join(" y "));return}
  let gainW=null,adj=0,note="";
  if(first){note="Punto de partida guardado. A partir de ahora, cada lunes comparamos con esta semana."}
  else{
    const prev=state.checkins[state.checkins.length-1];
    const days=Math.max(4,diffDays(prev.date,today()));
    gainW=(avg-prev.avg)*7/days;
    const[lo,hi]=c0.range;
    const prevM=[...state.checkins].reverse().find(c=>c.meas&&c.meas.cintura);
    const waistUp=meas&&meas.cintura&&prevM?meas.cintura-prevM.meas.cintura:0;
    if(gainW<lo){
      state.lowStreak=(state.lowStreak||0)+1;
      if(state.lowStreak>=2){adj=150;state.lowStreak=0;note=`Dos semanas por debajo del ritmo objetivo: subimos 150 kcal, sobre todo en carbohidratos.`}
      else note=`Esta semana has ganado menos de lo previsto. Si la próxima se repite, subiremos calorías. Revisa que estés completando todas las comidas.`;
    }else if(gainW>hi){
      state.lowStreak=0;
      if(state.checkins.length===1){note="La primera semana es normal subir más rápido: comes más y tus músculos guardan más glucógeno y agua. Mantenemos el plan."}
      else if(gainW>hi+0.2){adj=-150;note="Estás subiendo bastante más rápido de lo necesario, así que bajamos 150 kcal para ganar músculo con menos grasa."}
      else if(waistUp>=1){adj=-100;note="Subes un poco rápido y la cintura ha crecido: bajamos 100 kcal."}
      else note="Vas algo por encima del ritmo, pero la cintura se mantiene. Seguimos igual y vigilamos."
    }else{state.lowStreak=0;note="Ritmo perfecto. Mantenemos las calorías."}
  }
  state.kcalAdj+=adj;
  const ci={date:today(),weekStart:weekStartNow(),avg:Math.round(avg*10)/10,photos:{...dr.photos},meas,rate:first?null:{...dr.rate},gainW:gainW==null?null:Math.round(gainW*100)/100,adj,note,kcalBefore:c0.kcal,coach:null};
  state.checkins.push(ci);
  if(!state.weights.some(w=>w.d===today()))state.weights.push({d:today(),kg:ci.avg});
  scaleCache.clear();
  ci.kcalAfter=calc().kcal;
  persist();
  ui.lastResult=state.checkins.length-1;ui.view="result";ui.draft=null;
  render();window.scrollTo(0,0);
}

function adherenceWeek(ws){
  if(!ws)return null;let total=0,done=0;
  for(let d=0;d<7;d++){const ds=addDays(ws,d);if(ds<state.createdAt||ds>today())continue;total+=5;const l=state.log[ds];if(l&&l.m)done+=Object.values(l.m).filter(Boolean).length}
  return total?Math.round(done/total*100):null;
}

function chartSVG(){
  const ws=[...state.weights].sort((a,b)=>a.d<b.d?-1:1);
  if(ws.length<2)return `<p class="muted small">Registra tu peso varios días para ver la gráfica.</p>`;
  const W=600,H=240,L=38,R=10,T=14,B=28;
  const d0=ws[0].d,dN=ws[ws.length-1].d,span=Math.max(7,diffDays(d0,dN));
  const avgPts=ws.map(w=>{const from=addDays(w.d,-6);const win=ws.filter(x=>x.d>=from&&x.d<=w.d);return{d:w.d,kg:win.reduce((a,x)=>a+x.kg,0)/win.length}});
  const c=calc(),mid=(c.range[0]+c.range[1])/2;
  const startKg=state.checkins.length?state.checkins[0].avg:ws[0].kg,startD=state.checkins.length?state.checkins[0].date:d0;
  const tgtEnd=startKg+mid*diffDays(startD,dN)/7;
  let lo=Math.min(...ws.map(w=>w.kg),startKg),hi=Math.max(...ws.map(w=>w.kg),tgtEnd);lo=Math.floor(lo-0.5);hi=Math.ceil(hi+0.5);
  const x=d=>L+(W-L-R)*diffDays(d0,d)/span,y=kg=>T+(H-T-B)*(1-(kg-lo)/(hi-lo));
  let g="";
  const step=Math.max(1,Math.round((hi-lo)/4));
  for(let v=lo;v<=hi;v+=step)g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`;
  g+=`<text x="${L}" y="${H-8}" font-size="11" fill="var(--muted)">${niceDate(d0)}</text><text x="${W-R}" y="${H-8}" font-size="11" text-anchor="end" fill="var(--muted)">${niceDate(dN)}</text>`;
  g+=`<line x1="${x(startD<d0?d0:startD)}" y1="${y(startKg)}" x2="${x(dN)}" y2="${y(tgtEnd)}" stroke="var(--fat)" stroke-width="2" stroke-dasharray="6 5"/>`;
  g+=ws.map(w=>`<circle cx="${x(w.d)}" cy="${y(w.kg)}" r="3" fill="var(--muted)" opacity=".55"/>`).join("");
  g+=`<polyline fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" points="${avgPts.map(p=>`${x(p.d).toFixed(1)},${y(p.kg).toFixed(1)}`).join(" ")}"/>`;
  return `<div class="chartbox"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución del peso">${g}</svg></div>
  <p class="small muted"><span style="color:var(--accent);font-weight:700">Línea azul</span>: media de 7 días. <span style="color:var(--fat);font-weight:700">Discontinua verde</span>: ritmo objetivo. Puntos grises: pesajes diarios.</p>`;
}

const shortName=id=>PRODUCTS[id].n.split(" (")[0];
function fixState(){
  state.train=state.train||{};state.hidden=state.hidden||[];
  state.profile.exclude=state.profile.exclude||[];state.swaps=state.swaps||{};
}
function breaksPlan(id){
  const ex=[...state.profile.exclude,id],hid=state.hidden||[];
  for(const s of SLOTS){
    const n=RECIPES.filter(r=>r.slots.includes(s)&&!hid.includes(r.id)&&!r.items.some(i=>ex.includes(i[0]))).length;
    if(n<2)return SLOT_INFO[s].l;
  }
  return null;
}
function cleanSwaps(){
  const ex=state.profile.exclude,hid=state.hidden||[];
  for(const ws of Object.keys(state.swaps)){
    for(const k of Object.keys(state.swaps[ws])){
      const r=RECIPES.find(x=>x.id===state.swaps[ws][k]);
      if(!r||hid.includes(r.id)||r.items.some(i=>ex.includes(i[0])))delete state.swaps[ws][k];
    }
  }
}
function dislikeChips(m){
  const ids=[...new Set(m.items.map(i=>i[0]))].filter(id=>id!=="aove");
  return `<div class="small muted mt8">¿Hay algo que no te guste? Quítalo y no volverá a salir:</div><div class="chips mt8">${ids.map(id=>`<button class="chip" data-noing="${id}">✕ ${esc(shortName(id))}</button>`).join("")}</div>`;
}
function batchDays(d){return [[0,1,2],[3,4],[5,6]][blockOf(d)]}
function openSheet(d,slot){ui.sheet={d,slot,scope:"day"};document.body.style.overflow="hidden";renderSheet()}
function closeSheet(){ui.sheet=null;const s=$("#sheet");s.hidden=true;s.innerHTML="";document.body.style.overflow=""}
function renderSheet(){
  const sh=ui.sheet,s=$("#sheet");if(!sh)return;
  const ws=weekStartNow(),c=calc(),si=SLOT_INFO[sh.slot],cur=recipeAt(ws,sh.d,sh.slot);
  const batch=(sh.slot==="comida"||sh.slot==="cena"),blk=batchDays(sh.d);
  let list=recipesFor(sh.slot);if(!list.some(r=>r.id===cur.id))list=[cur,...list];
  const ex=state.profile.exclude,hid=state.hidden;
  const rows=list.map(r=>{
    const m=scaleRecipe(r,c.kcal*si.k,c.P*si.p,c.F*si.k).m,isCur=r.id===cur.id;
    return `<div class="opt ${isCur?"cur":""}"><div class="row between" style="flex-wrap:nowrap"><div><b>${esc(r.n)}</b><div class="mm">${fmt0(m.k)} kcal · ${fmt0(m.p)} g prot · ${r.min} min${r.portable?" · táper":""}${r.batch?" · batch":""}</div></div>${isCur?'<span class="tag">Actual</span>':`<button class="btn sm primary" data-pick="${r.id}">Elegir</button>`}</div><button class="linkbtn" data-hide="${r.id}">No me gusta esta receta</button></div>`;
  }).join("");
  const swapped=!!(state.swaps[ws]||{})[`${sh.d}-${sh.slot}`];
  s.innerHTML=`<div class="sheetbox" role="dialog" aria-modal="true" aria-label="Cambiar comida">
    <div class="row between"><h2>${si.l} del ${DAYS[sh.d].toLowerCase()}</h2><button class="btn sm ghost" data-act="closeSheet">Cerrar</button></div>
    <p class="small muted">Todas las opciones se ajustan a tus calorías y proteína.</p>
    ${batch?`<div class="seg mt8" role="group" aria-label="Dónde aplicar el cambio"><button data-scope="day" aria-pressed="${sh.scope==="day"}">Solo este día</button><button data-scope="block" aria-pressed="${sh.scope==="block"}">Todo el bloque (${blk.length} días)</button></div><p class="hint">El bloque son los días que comen del mismo batch cooking.</p>`:""}
    ${rows}
    ${swapped?`<button class="btn ghost block mt8" data-act="unswap">Volver a la receta original</button>`:""}
    ${ex.length?`<div class="hr"></div><div class="small muted">Ingredientes que has quitado (toca para permitirlos otra vez):</div><div class="chips mt8">${ex.map(id=>`<button class="chip" data-unexcl="${id}">${esc(shortName(id))} ✕</button>`).join("")}</div>`:""}
    ${hid.length?`<button class="linkbtn mt8" data-act="unhide">Recuperar ${hid.length} ${hid.length===1?"receta oculta":"recetas ocultas"}</button>`:""}
  </div>`;
  s.hidden=false;
}

function suggest(e,last){

  if(!last)return{kg:"",txt:tm?`Aguanta entre ${e.a} y ${e.b} segundos por serie.`:`Elige un peso con el que llegues a ${e.a} repeticiones dejando 1–2 en reserva. Es solo el punto de partida: apunta lo que uses.`};
  const desc=last.sets.map(s=>tm?`${s.r} s`:`${s.k?kgTxt(s.k)+" kg × ":""}${s.r}`).join(" · ");
  const hit=last.sets.length>=e.s&&last.sets.every(s=>s.r>=e.b);
  const head=`Última vez (${niceDate(last.date)}): ${desc}. `;
  if(tm)return{kg:"",txt:head+(hit?"Prueba a aguantar 5 segundos más.":"Intenta igualarlo o mejorarlo.")};
  const mk=Math.max(...last.sets.map(s=>s.k||0));
  if(hit&&mk>0)return{kg:Math.round((mk+e.inc)*100)/100,txt:head+`Lo completaste todo: hoy prueba ${kgTxt(mk+e.inc)} kg.`};

   <details><summary>Cómo entrenar</summary><ul class="small" style="padding-left:18px;margin:8px 0 0"><li>Calienta 5 minutos (bici o cinta suave) y haz 1–2 series ligeras del primer ejercicio.</li><li>Termina cada serie dejando 1–2 repeticiones en reserva. Si la técnica se rompe, baja el peso.</li><li>Cuando completes todas las series en el máximo de repeticiones, sube un poco el peso la próxima vez. Esa es la forma de crecer.</li><li>En los ejercicios con mancuernas, apunta los kilos de <b>una sola mancuerna</b>.</li><li>Si un movimiento es nuevo, pide a alguien del gimnasio que te revise la técnica.</li></ul></details></section>`;
  for(const e of rt.ex){
    const x=EX[e.id],last=lastLog(e.id,date),sg=suggest(e,last),saved=cur[e.id]||[];
    let rows="";
    for(let i=0;i<e.s;i++){
      const sv=saved[i],kv=sv&&sv.k!=null&&sv.k!==0?sv.k:(sv&&sv.r>0?"":sg.kg),rv=sv&&sv.r>0?sv.r:"",ph=last&&last.sets[i]?last.sets[i].r:e.a;
      rows+=`<div class="setrow"><span class="sn">${i+1}</span>${x.time?"":`<input class="inp sm" inputmode="decimal" data-tk="${e.id}|${i}" value="${kv===""?"":String(kv).replace(".",",")}" placeholder="kg" aria-label="Kilos serie ${i+1}"><span class="muted">kg ×</span>`}<input class="inp sm" inputmode="numeric" data-tr="${e.id}|${i}" value="${rv}" placeholder="${ph}" aria-label="${x.time?"Segundos":"Repeticiones"} serie ${i+1}"><span class="muted">${x.time?"seg":"rep"}</span></div>`;
    }
    h+=`<article class="exc"><h3 style="font-stretch:105%">${esc(x.n)}</h3><div class="mm">${esc(x.m)} · ${e.s} × ${e.a}${e.b!==e.a?"–"+e.b:""}${x.time?" seg":""} · descanso ${e.r>=120?"2 min":e.r>=90?"90 s":"60 s"}${x.db?" · kg por mancuerna":""}</div>
     <div class="sug">${esc(sg.txt)}</div>${rows}
     <details><summary>Cómo hacerlo</summary><p class="small">${esc(x.c)}</p><div class="imgs"><img loading="lazy" src="${EXR}${e.id}/0.jpg" alt="${esc(x.n)}, posición inicial"><img loading="lazy" src="${EXR}${e.id}/1.jpg" alt="${esc(x.n)}, posición final"></div></details></article>`;
  }
  h+=`<p class="hint">Ejercicios e imágenes de <a href="https://github.com/yuhonas/free-exercise-db" target="_blank" rel="noopener">free-exercise-db</a> (dominio público). Rutina de ${g.length} días para principiantes, no sustituye a un entrenador. Si notas dolor (no el cansancio normal del músculo), para y consúltalo.</p>`;
  return h;
}
function updTrainProg(){
  const rt=routineFor(ui.trainDay);if(!rt)return;const cur=(state.train[ui.trainDate]||{}).ex||{};
  const el=$("#trainProg");if(el)el.textContent=`${rt.ex.filter(e=>(cur[e.id]||[]).some(s=>s.r>0)).length} de ${rt.ex.length} apuntados`;
}
function saveSetRow(row){
  const kI=row.querySelector("[data-tk]"),rI=row.querySelector("[data-tr]");
  const src=(kI||rI).dataset.tk||rI.dataset.tr,[id,i]=src.split("|"),idx=+i;
  const num=v=>{const n=parseFloat(String(v).replace(",","."));return isFinite(n)&&n>0?n:0};
  const dt=ui.trainDate;
  const tr=state.train[dt]=state.train[dt]||{rt:ui.trainName,ex:{}};
  const arr=tr.ex[id]=tr.ex[id]||[];
  while(arr.length<=idx)arr.push({k:0,r:0});
  arr[idx]={k:kI?num(kI.value):0,r:num(rI.value)};
  persist();updTrainProg();
}

/* ============ EVENTOS ============ */
function bindAfter(){
  hydratePhotos();
  const r=$("#cmpRange");
  if(r)r.addEventListener("input",()=>{ui.cmpPos=+r.value;$("#cmpAfter").style.clipPath=`inset(0 0 0 ${ui.cmpPos}%)`;$("#cmpLine").style.left=ui.cmpPos+"%"});
  const a=$("#cmpA"),b=$("#cmpB");
  if(a)a.addEventListener("change",()=>{ui.cmpA=+a.value;render()});
  if(b)b.addEventListener("change",()=>{ui.cmpB=+b.value;render()});
  const ca=$("#ciAvg");if(ca)ca.addEventListener("input",()=>ui.draft.avg=ca.value);
  document.querySelectorAll("[data-meas]").forEach(i=>i.addEventListener("input",()=>ui.draft.meas[i.dataset.meas]=i.value));
  document.querySelectorAll("[data-photo]").forEach(inp=>inp.addEventListener("change",async()=>{
    const f=inp.files&&inp.files[0];if(!f)return;const k=inp.dataset.photo;
    const box=$("#ph-"+k);box.querySelector(".cap").textContent="Subiendo…";
    try{const id=await storePhoto(f);if(id){ui.draft.photos[k]=id}}catch(e){toast("No se pudo leer la imagen")}
    render();
  }));
}
document.addEventListener("click",async e=>{
  if(e.target.id==="sheet"){closeSheet();return}
  const t=e.target.closest("button,[data-shop],[data-meal],[data-act]");if(!t)return;
  const ds=t.dataset;
  if(ds.tab){ui.tab=ds.tab;ui.view=null;if(ds.tab==="entreno")ui.trainDay=null;render();window.scrollTo(0,0);return}
  if(ds.day!=null&&t.closest(".days")){ui.planDay=+ds.day;render();return}
  if(ds.daychip){t.setAttribute("aria-pressed",t.getAttribute("aria-pressed")==="true"?"false":"true");return}
  if(ds.excl){t.setAttribute("aria-pressed",t.getAttribute("aria-pressed")==="true"?"false":"true");return}
  if(ds.pose){ui.cmpPose=ds.pose;render();return}
  if(ds.rate){ui.draft.rate[ds.rate]=+ds.v;t.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b===t));return}
  if(ds.swap){const[dd,slot]=ds.swap.split("-");openSheet(+dd,slot);return}
  if(ds.scope){ui.sheet.scope=ds.scope;renderSheet();return}
  if(ds.pick){
    const sh=ui.sheet,ws=weekStartNow(),batch=(sh.slot==="comida"||sh.slot==="cena");
    state.swaps[ws]=state.swaps[ws]||{};
    const days=(sh.scope==="block"&&batch)?batchDays(sh.d):[sh.d];
    for(const dd of days)state.swaps[ws][`${dd}-${sh.slot}`]=ds.pick;
    persist();closeSheet();render();toast(days.length>1?"Cambiado en todo el bloque":"Comida cambiada");return;
  }
  if(ds.hide){
    const r=RECIPES.find(x=>x.id===ds.hide);
    const bad=r.slots.find(s=>recipesFor(s).filter(x=>x.id!==r.id).length<2);
    if(bad){toast(`No puedo ocultar más recetas de ${SLOT_INFO[bad].l.toLowerCase()}`);return}
    state.hidden.push(r.id);cleanSwaps();persist();render();renderSheet();toast("No volverá a salir esa receta");return;
  }
  if(ds.noing){
    const b=breaksPlan(ds.noing),nm=shortName(ds.noing);
    if(b){toast(`Sin ${nm.toLowerCase()} no me quedan recetas de ${b.toLowerCase()}`);return}
    state.profile.exclude.push(ds.noing);cleanSwaps();persist();render();toast(`Hecho: ya no saldrá ${nm.toLowerCase()}`);return;
  }
  if(ds.unexcl){
    state.profile.exclude=state.profile.exclude.filter(x=>x!==ds.unexcl);persist();render();renderSheet();return;
  }
  if(ds.tday!=null){ui.trainDay=+ds.tday;render();return}
  if(ds.shop!=null&&t.matches("input")){
    const ws=weekStartNow();const arr=new Set(state.shop[ws]||[]);t.checked?arr.add(ds.shop):arr.delete(ds.shop);
    state.shop={[ws]:[...arr]};persist();t.closest("label").classList.toggle("got",t.checked);return;
  }
  if(ds.meal!=null&&t.matches("input")){
    const td=today();state.log[td]=state.log[td]||{m:{}};state.log[td].m=state.log[td].m||{};state.log[td].m[ds.meal]=t.checked;
    pruneLog();persist();render();return;
  }
  const act=ds.act;if(!act)return;
  if(act==="closeSheet"){closeSheet();return}
  if(act==="unswap"){const sh=ui.sheet,ws=weekStartNow(),batch=(sh.slot==="comida"||sh.slot==="cena");
    const days=(sh.scope==="block"&&batch)?batchDays(sh.d):[sh.d];for(const dd of days)delete (state.swaps[ws]||{})[`${dd}-${sh.slot}`];
    persist();closeSheet();render();return}
  if(act==="unhide"){state.hidden=[];persist();render();renderSheet();return}
  if(act==="crea"){const td=today();state.log[td]=state.log[td]||{m:{}};state.log[td].crea=t.checked;persist();render();return}
  if(act==="finishOnb"){const p=readProfileForm(ui.onb);if(!p)return;state=newState(p);persist();ui.tab="hoy";render();window.scrollTo(0,0);return}
  if(act==="saveW"){
    const v=parseFloat(String($("#wIn").value).replace(",","."));if(!(v>30&&v<250)){toast("Escribe tu peso en kg, por ejemplo 56,4");return}
    const td=today();state.weights=state.weights.filter(w=>w.d!==td);state.weights.push({d:td,kg:Math.round(v*10)/10});persist();toast("Peso guardado");render();return;
  }
  if(act==="startCheckin"){ui.view="checkin";render();window.scrollTo(0,0);return}
  if(act==="closeView"){ui.view=null;render();return}
  if(act==="submitCheckin"){submitCheckin();return}
  if(act==="toPlan"){ui.view=null;ui.tab="plan";ui.planDay=dayIdx(today());render();window.scrollTo(0,0);return}
  if(act==="saveProfile"){const p=readProfileForm(state.profile);if(!p)return;state.profile=p;scaleCache.clear();persist();toast("Cambios guardados");render();return}
  if(act==="export"){await offerDownload("volumen-mis-datos.json",JSON.stringify(state,null,2));return}
  if(act==="ics"){await offerDownload("volumen-recordatorios.ics",buildICS());return}
  if(act==="reset"){if(confirm("Se borrarán tu perfil, pesos, check-ins y fotos. ¿Seguro?")){
    const refs=state.checkins.flatMap(c=>Object.values(c.photos||{})).filter(r=>r&&!r.startsWith("local:"));
    if(sb){if(refs.length)await sb.storage.from(BUCKET).remove(refs);await sb.from("app_state").delete().eq("user_id",uid())}
    try{localStorage.removeItem(LS_KEY())}catch(e){}
    state=null;ui.onb=null;render()}return}
  if(act==="logout"){await sb.auth.signOut();return}
  if(act==="login"||act==="signup"){
    const email=$("#aEmail").value.trim(),pass=$("#aPass").value;
    if(!email||pass.length<6){ui.authMsg="Escribe tu email y una contraseña de al menos 6 caracteres.";render();return}
    t.disabled=true;
    const res=act==="login"?await sb.auth.signInWithPassword({email,password:pass}):await sb.auth.signUp({email,password:pass});
    if(res.error){ui.authMsg=act==="login"?"Email o contraseña incorrectos.":("No se pudo crear la cuenta: "+res.error.message);t.disabled=false;render();return}
    if(act==="signup"&&!res.data.session){ui.authMsg="Cuenta creada. Confirma el email que te ha llegado y luego entra.";render()}
    return}
});
document.addEventListener("input",e=>{
  const t=e.target;if(!t.dataset||!(t.dataset.tk||t.dataset.tr))return;
  saveSetRow(t.closest(".setrow"));
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&ui.sheet)closeSheet()});
function pruneLog(){const keys=Object.keys(state.log).sort();while(keys.length>120)delete state.log[keys.shift()]}
async function offerDownload(filename,data){
  const type=filename.endsWith(".ics")?"text/calendar":"application/json";
  const url=URL.createObjectURL(new Blob([data],{type}));
  const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);toast("Archivo descargado");
}
function buildICS(){
  const p=state.profile,start=today().replace(/-/g,"");
  const mon=mondayOf(addDays(today(),7)).replace(/-/g,"");
  const tt=m=>hhmm(m).replace(":","")+"00";
  const ev=(uid,day,time,title,desc,rule)=>`BEGIN:VEVENT\r\nUID:${uid}@volumen\r\nDTSTAMP:${start}T000000Z\r\nDTSTART:${day}T${tt(time)}\r\nDURATION:PT10M\r\nRRULE:${rule}\r\nSUMMARY:${title}\r\nDESCRIPTION:${desc}\r\nBEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:${title}\r\nTRIGGER:PT0M\r\nEND:VALARM\r\nEND:VEVENT\r\n`;
  const wake=toMin(p.despertar);
  return "BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Volumen//ES\r\n"+
    ev("peso",start,wake+5,"Pésate en ayunas","Después de ir al baño y antes de beber. Apúntalo en Volumen.","FREQ=DAILY")+
    ev("creatina",start,wake+25,"Creatina 5 g","Con el desayuno. Todos los días.","FREQ=DAILY")+
    ev("checkin",mon,wake+10,"Check-in semanal en Volumen","Peso medio, 3 fotos y valoraciones. Tu plan se desbloquea al hacerlo.","FREQ=WEEKLY;BYDAY=MO")+
    ev("batch",addDays(mondayOf(today()),6).replace(/-/g,""),toMin("11:00"),"Batch cooking","Cocina las comidas de lunes a miércoles. Mira el plan en Volumen.","FREQ=WEEKLY;BYDAY=SU")+
    "END:VCALENDAR\r\n";
}

boot();
